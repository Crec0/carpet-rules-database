name: pages

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    build:
        name: Build site
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                shell: bash
                working-directory: ./frontend

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 1
                    persist-credentials: false

            -   name: Set up Bun
                id: bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: latest

            -   name: Get Bun version
                id: bun-version
                run: echo "version=$(bun --version)" >> "$GITHUB_OUTPUT"

            -   name: Cache Bun packages
                uses: actions/cache@v6
                with:
                    path: ~/.bun/install/cache
                    key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun-version.outputs.version }}-${{ hashFiles('frontend/bun.lock', 'frontend/bun.lockb', 'frontend/package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun-version.outputs.version }}-

            -   name: Install dependencies
                run: bun install --frozen-lockfile

            -   name: Prepare generated assets
                env:
                    SOURCE_SHA: ${{ github.sha }}
                run: |
                    set -euo pipefail
                    
                    mkdir -p ./src/lib/assets
                    
                    short_sha="$(git rev-parse --short "$SOURCE_SHA")"
                    printf '{"sha":"%s"}\n' "$short_sha" \
                      > ./src/lib/assets/sha.json
                    
                    cp ../data/parsed_data.json ./src/lib/assets/rules.json

            -   name: Build
                run: bun run build

            -   name: Prepare Pages output
                run: |
                    set -euo pipefail
                    
                    test -f ./build/index.html
                    printf '%s\n' 'carpet-rules.crec.dev' > ./build/CNAME

            -   name: Upload Pages artifact
                uses: actions/upload-pages-artifact@v5.0.0
                with:
                    path: ./frontend/build
                    retention-days: 1

    deploy:
        name: Deploy site
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            -   name: Deploy Pages
                id: deployment
                uses: actions/deploy-pages@v5.0.1

            -   name: Send Discord webhook
                uses: tsickert/discord-webhook@v7.0.0
                with:
                    webhook-url: ${{ secrets.CARPET_RULES_WEBHOOK_URL }}
                    content: >-
                        Successfully deployed ${{ github.sha }}:
                        ${{ steps.deployment.outputs.page_url }}