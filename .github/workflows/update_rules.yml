name: Update rules database

on:
    workflow_dispatch:
    schedule:
        -   cron: '0 0 * * *'

permissions:
    contents: read

concurrency:
    group: update-rules-database-main
    cancel-in-progress: false

env:
    PYTHON_VERSION: '3.15.2'
    UV_NO_PROGRESS: '1'
    PYTHONUNBUFFERED: '1'

defaults:
    run:
        shell: bash

jobs:
    update-and-upload:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   name: Checkout main
                uses: actions/checkout@v7
                with:
                    ref: main
                    token: ${{ secrets.PAT }}
                    fetch-depth: 1

            -   name: Set up uv
                uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
                with:
                    python-version: ${{ env.PYTHON_VERSION }}
                    enable-cache: true
                    cache-dependency-glob: |
                        uv.lock
                        pyproject.toml
                        .python-version

            -   name: Install Python
                run: uv python install "$PYTHON_VERSION"

            -   name: Install locked dependencies
                run: uv sync --locked --no-dev

            -   name: Run generator
                id: generator
                run: |
                    set -euo pipefail
                    
                    output_file="$RUNNER_TEMP/generator-output.txt"
                    
                    uv run --no-sync generator | tee "$output_file"
                    
                    delimiter="EOF_$(cat /proc/sys/kernel/random/uuid)"
                    {
                      echo "description<<${delimiter}"
                      cat "$output_file"
                      printf '\n%s\n' "$delimiter"
                    } >> "$GITHUB_OUTPUT"
                    
                    {
                      echo '## Generator output'
                      cat "$output_file"
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Commit and push changes
                id: commit
                run: |
                    set -euo pipefail
                    
                    timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                    echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
                    
                    git config user.name 'Crec0'
                    git config user.email 'crec0@pm.me'
                    
                    # Stage tracked changes only, matching the original workflow.
                    git add --update
                    
                    if git diff --cached --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "No database changes." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                    
                    git commit -m "Update rules database '$timestamp'"
                    
                    # Fail rather than overwrite concurrent changes to main.
                    git push origin HEAD:main
                    
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                    echo "Database changes committed and pushed." >> "$GITHUB_STEP_SUMMARY"

            -   name: Send Discord webhook
                uses: tsickert/discord-webhook@v4.0.0
                with:
                    webhook-url: ${{ secrets.CARPET_RULES_WEBHOOK_URL }}
                    embed-title: "Carpet rules database stats"
                    embed-description: ${{ steps.generator.outputs.description }}
                    embed-color: 0xf0932b
                    username: "Carpet Rules Generator"
                    avatar-url: ${{ secrets.CARPET_RULES_AVATAR_URL }}
                    content: ${{ steps.commit.outputs.timestamp }}