[project]
name = "carpet-rules-database"
version = "0.1.0"
description = "Website to track all carpet rules"
authors = [{ name = "Crec0" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "httpx>=0.23.3,<0.24.0",
    "pyjson5>=1.6.2,<2.0.0",
    "PyYAML>=6.0,<7.0",
    "blue>=0.9.1,<0.10.0",
    "dataclasses-json>=0.5.7,<0.6.0",
    "pytoml>=0.1.21,<0.2.0",
]

[project.scripts]
generator = "generator.main:main"
sort_repos = "generator.main:sort_repos"

[dependency-groups]
dev = [
    "isort>=5.12.0,<6.0.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]